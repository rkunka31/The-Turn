<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Turn</title>

<style>
body{margin:0;font-family:Arial;background:#f4efe4}
.app{max-width:420px;margin:auto;background:#fff;min-height:100vh;padding-bottom:80px}
.header{background:#0f5f3d;color:#fff;padding:16px}
.section{padding:12px}
.card{border:1px solid #ddd;border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.row{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
button{border:none;border-radius:8px;padding:8px 10px;background:#0f5f3d;color:#fff}
.score{min-width:20px;text-align:center;font-weight:900}
.small{font-size:11px;color:#777}
.green{color:#0f5f3d;font-weight:900}
.red{color:#b6483f;font-weight:900}
.tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #ddd}
.tabbar button{flex:1;background:#fff;color:#333}
.active{background:#0f5f3d;color:#fff}
</style>

</head>
<body>

<div class="app">

<div class="header">
<h2>The Turn</h2>
<div class="small">Greystone prototype</div>
</div>

<div id="home" class="section"></div>
<div id="score" class="section" style="display:none"></div>
<div id="games" class="section" style="display:none"></div>

</div>

<div class="tabbar">
<button onclick="show('home')">Home</button>
<button onclick="show('score')">Score</button>
<button onclick="show('games')">Games</button>
</div>

<script>

const pars=[5,3,4,5,4,3,4,4,4,5,3,4,4,3,4,4,4,5]
const hcp=[17,13,7,11,3,15,1,5,9,4,12,2,8,14,18,10,6,16]

let players=[
{name:"Rob",hcp:7,team:"A"},
{name:"Mike",hcp:11,team:"B"},
{name:"Chris",hcp:15,team:"B"},
{name:"Alex",hcp:4,team:"A"}
]

let scores={}
players.forEach(p=>scores[p.name]=[...pars])

let hole=0

function show(tab){
document.getElementById("home").style.display="none"
document.getElementById("score").style.display="none"
document.getElementById("games").style.display="none"
document.getElementById(tab).style.display="block"
render()
}

function strokes(p,h){
let extra=p.hcp%18
return Math.floor(p.hcp/18)+(hcp[h]<=extra?1:0)
}

function net(p,h){
return scores[p.name][h]-strokes(p,h)
}

function home(){
let html=`<div class="card">
<div class="row">
<div><b>Saturday Skins</b><div class="small">4 players</div></div>
<button onclick="show('score')">Start</button>
</div></div>`
document.getElementById("home").innerHTML=html
}

function score(){
let html=`<div class="card">
<div class="row"><b>Hole ${hole+1}</b><div>Par ${pars[hole]}</div></div>`

players.forEach((p,i)=>{
html+=`<div class="row">
<div>${p.name}</div>
<button onclick="scores['${p.name}'][${hole}]--">-</button>
<div class="score">${scores[p.name][hole]}</div>
<button onclick="scores['${p.name}'][${hole}]++">+</button>
<div>${net(p,hole)}</div>
</div>`
})

html+=`<button onclick="hole=Math.max(0,hole-1)">Prev</button>
<button onclick="hole=Math.min(17,hole+1)">Next</button>
</div>`

document.getElementById("score").innerHTML=html
}

function totals(){
return players.map(p=>{
let t=0
for(let i=0;i<18;i++)t+=net(p,i)
return {name:p.name,total:t}
}).sort((a,b)=>a.total-b.total)
}

function games(){
let t=totals()
let html=`<div class="card"><b>Leaderboard</b>`
t.forEach(x=>{
html+=`<div class="row"><div>${x.name}</div><div>${x.total}</div></div>`
})
html+=`</div>`
document.getElementById("games").innerHTML=html
}

function render(){
home()
score()
games()
}

render()

</script>

</body>
</html>
